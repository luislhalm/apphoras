<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierre industrial · CAPA</title>
<style>
:root{
  --naranja:#F08900;
  --purpura:#942E86;
  --rosa:#C74D92;
  --rojo:#CE092C;
  --tinta:#3E3938;
  --tinta-suave:#7A7573;
  --fondo:#ECEDEF;
  --superficie:#FFFFFF;
  --linea:#D8D9DD;
  --linea-fuerte:#B9BBC1;
  --ok:#1F7A4D;
  --ok-fondo:#E8F3ED;
  --aviso-fondo:#FDF1E0;
  --error:#CE092C;
  --error-fondo:#FBE8EC;
  --fuente:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--fuente);
  background:var(--fondo);
  color:var(--tinta);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--purpura);outline-offset:2px}

/* ---------- cabecera ---------- */
.barra{
  background:var(--superficie);
  border-bottom:1px solid var(--linea);
  position:sticky;top:0;z-index:40;
}
.barra-cinta{height:3px;background:linear-gradient(90deg,var(--purpura),var(--rosa) 45%,var(--naranja))}
.barra-fila{
  max-width:1240px;margin:0 auto;padding:14px 22px;
  display:flex;align-items:center;gap:16px;
}
.barra-fila img{height:26px;width:auto;display:block}
.barra-titulo{font-weight:700;letter-spacing:-.01em;margin-left:4px}
.barra-titulo span{display:block;font-weight:400;font-size:12.5px;color:var(--tinta-suave);letter-spacing:0}
.barra-dcha{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--tinta-suave)}
.btn-texto{background:none;border:none;color:var(--purpura);font-weight:600;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

/* ---------- contenedor ---------- */
.envoltorio{max-width:1240px;margin:0 auto;padding:26px 22px 90px}

/* ---------- login ---------- */
.portada{
  max-width:430px;margin:12vh auto;background:var(--superficie);
  border:1px solid var(--linea);padding:38px 34px;
}
.portada h1{font-size:23px;margin:0 0 6px;letter-spacing:-.015em}
.portada p{color:var(--tinta-suave);margin:0 0 26px;font-size:14px}
.portada img{height:30px;margin-bottom:26px;display:block}

.btn{
  background:var(--purpura);color:#fff;border:none;
  padding:11px 20px;font-weight:600;letter-spacing:.01em;
}
.btn:hover{background:#7d2671}
.btn:disabled{background:var(--linea-fuerte);cursor:not-allowed}
.btn-naranja{background:var(--naranja)}
.btn-naranja:hover{background:#d47b00}
.btn-sec{background:none;color:var(--tinta);border:1px solid var(--linea-fuerte);padding:10px 18px;font-weight:600}
.btn-sec:hover{border-color:var(--tinta);}

/* ---------- panel de cierre ---------- */
.cierre{
  background:var(--superficie);border:1px solid var(--linea);
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:30px;
  padding:24px 26px;margin-bottom:22px;
}
.cierre-mes{min-width:250px}
.cierre-mes .rotulo{font-size:12.5px;color:var(--tinta-suave);margin-bottom:5px}
.cierre-mes .nombre{
  font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.05;
  text-transform:capitalize;margin-bottom:12px;
}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-size:12.5px;color:var(--tinta-suave)}
.campo input,.campo select{
  border:1px solid var(--linea-fuerte);background:#fff;
  padding:8px 10px;min-width:170px;
}
.campo input:disabled{background:#F6F6F7;color:var(--tinta-suave)}

.avance{margin-left:auto;text-align:right;min-width:190px}
.avance .cuenta{font-size:14px;font-weight:600;margin-bottom:8px}
.avance .cuenta em{font-style:normal;color:var(--tinta-suave);font-weight:400}
.segmentos{display:flex;gap:3px;justify-content:flex-end}
.segmentos i{width:26px;height:7px;background:var(--linea);display:block}
.segmentos i.lleno{background:var(--naranja)}

/* ---------- líneas ---------- */
.linea-prod{
  background:var(--superficie);border:1px solid var(--linea);
  border-left:4px solid var(--linea-fuerte);margin-bottom:12px;
}
.linea-prod[data-empresa="FCAP"]{border-left-color:var(--naranja)}
.linea-prod[data-empresa="TORR"]{border-left-color:var(--purpura)}
.linea-cab{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 18px;border-bottom:1px solid var(--linea);
}
.linea-cab h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.etq{
  font-size:11.5px;font-weight:700;padding:2px 7px;
  border:1px solid currentColor;letter-spacing:.02em;
}
.etq.fcap{color:#B06600}
.etq.torr{color:var(--purpura)}
.estado{margin-left:auto;font-size:12.5px;display:flex;align-items:center;gap:7px}
.punto{width:8px;height:8px;border-radius:50%;background:var(--linea-fuerte);display:inline-block}
.estado.guardado{color:var(--ok)} .estado.guardado .punto{background:var(--ok)}
.estado.pendiente{color:var(--tinta-suave)}
.estado.error{color:var(--error)} .estado.error .punto{background:var(--error)}

.rejilla{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:0;
}
.celda{padding:12px 18px;border-right:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.celda label{display:block;font-size:12px;color:var(--tinta-suave);margin-bottom:4px;line-height:1.3}
.celda input{
  width:100%;border:none;border-bottom:1.5px solid var(--linea-fuerte);
  padding:4px 0;background:none;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:right;
}
.celda input:focus{border-bottom-color:var(--purpura);outline:none}
.celda input.tocado{border-bottom-color:var(--naranja)}

/* ---------- barra de guardado ---------- */
.pie{
  position:fixed;left:0;right:0;bottom:0;background:var(--superficie);
  border-top:1px solid var(--linea-fuerte);z-index:30;
}
.pie-fila{
  max-width:1240px;margin:0 auto;padding:13px 22px;
  display:flex;align-items:center;gap:16px;
}
.pie-nota{font-size:13px;color:var(--tinta-suave)}
.pie-acciones{margin-left:auto;display:flex;gap:10px}

/* ---------- avisos ---------- */
.aviso{padding:12px 16px;margin-bottom:18px;font-size:14px;border:1px solid}
.aviso.info{background:var(--aviso-fondo);border-color:#E9C68C;color:#8A5A00}
.aviso.mal{background:var(--error-fondo);border-color:#EBAFBB;color:#9C0721}
.aviso.bien{background:var(--ok-fondo);border-color:#A8D2BC;color:var(--ok)}
.vacio{padding:52px 22px;text-align:center;color:var(--tinta-suave);background:var(--superficie);border:1px solid var(--linea)}
.cargando{padding:52px 22px;text-align:center;color:var(--tinta-suave)}

.planta{background:var(--superficie);border:1px solid var(--linea);
  border-left:4px solid var(--linea-fuerte);margin-bottom:14px}
.planta[data-empresa="FCAP"]{border-left-color:var(--naranja)}
.planta[data-empresa="TORR"]{border-left-color:var(--purpura)}
.planta-cab{display:flex;align-items:stretch;border-bottom:1px solid var(--linea-fuerte)}
.planta-ident{display:flex;align-items:center;gap:10px;padding:15px 18px;
  min-width:200px;flex-shrink:0;border-right:1px solid var(--linea)}
.planta-cab h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.rejilla-planta{flex:1;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.rejilla-planta .celda{border-bottom:none;display:flex;flex-direction:column;justify-content:center}
.rejilla-planta .celda:last-child{border-right:none}
.linea-cab{background:#FAFAFB}
.nota-planta{margin:0;padding:10px 18px;font-size:12.5px;color:var(--tinta-suave);border-bottom:1px solid var(--linea)}
.oculto{display:none !important}
@media (max-width:760px){
  .planta-cab{flex-direction:column}
  .planta-ident{border-right:none;border-bottom:1px solid var(--linea);min-width:0}
  .rejilla-planta .celda{border-bottom:1px solid var(--linea)}
}
@media (max-width:640px){
  .barra-fila,.envoltorio,.pie-fila{padding-left:14px;padding-right:14px}
  .cierre{padding:18px}
  .avance{margin-left:0;text-align:left}
  .segmentos{justify-content:flex-start}
  .rejilla{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<script>
"use strict";

/* ============ estado ============ */
const S = {
  msal:null, cuenta:null, token:null,
  siteId:null, listId:null,
  col:{},             // nombres internos resueltos de las columnas clave
  cols:[],            // esquema completo de la lista
  campos:[],          // columnas editables descubiertas en la lista
  items:[],           // todos los elementos de la lista
  combos:[],          // combinaciones planta/sublínea/empresa conocidas
  extra:[],           // líneas añadidas a mano en esta sesión
  mes:null, empresa:null,
  tocado:{},          // { claveLinea: { campo: valor } }
  guardando:false
};

const GRAPH = "https://graph.microsoft.com/v1.0";
const $ = id => document.getElementById(id);

/* ============ utilidades ============ */
function mesActual(){
  const h = new Date();
  return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,"0")}`;
}
function mesAnterior(){
  const h = new Date(); h.setDate(1); h.setMonth(h.getMonth()-1);
  return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,"0")}`;
}
function nombreMes(ym){
  if(!ym) return "—";
  const [y,m] = ym.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("es-ES",{month:"long", year:"numeric"});
}
// Fecha que se graba: mediodía UTC para que ningún huso cambie el día
function fechaDeMes(ym){
  const [y,m] = ym.split("-").map(Number);
  const dia = CFG.diaDelMes === "primero"
    ? Date.UTC(y, m-1, 1, 12, 0, 0)
    : Date.UTC(y, m, 0, 12, 0, 0);
  return new Date(dia).toISOString();
}
// Mes al que pertenece una fecha almacenada
function mesDeFecha(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d)) return null;
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}`;
}
// Acepta 1.234,56 y 1234.56
function aNumero(txt){
  if(txt===null || txt===undefined) return null;
  const s = String(txt).trim();
  if(s==="") return null;
  const limpio = s.replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");
  const n = Number(limpio);
  return isNaN(n) ? null : n;
}
function mostrar(v){
  if(v===null || v===undefined || v==="") return "";
  return typeof v === "number" ? String(v).replace(".", ",") : String(v);
}
function txt(v){ return (v===null||v===undefined) ? "" : String(v).trim(); }
function clave(c){ return `${c.planta}||${c.sub}||${c.empresa}`; }
function escapar(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function aviso(texto, tipo){
  $("avisos").innerHTML = `<div class="aviso ${tipo||"info"}">${escapar(texto)}</div>`;
  window.scrollTo({top:0, behavior:"smooth"});
}
function limpiarAvisos(){ $("avisos").innerHTML = ""; }

/* ============ carga de MSAL ============ */
const CDNS = [
  "https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js",
  "https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js",
  "https://unpkg.com/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"
];
function inyectar(url){
  return new Promise((ok,mal)=>{
    const t=document.createElement("script");
    t.src=url; t.async=true;
    t.onload =()=> (typeof msal!=="undefined") ? ok(url) : mal(new Error("cargado pero vacío"));
    t.onerror=()=> mal(new Error("no accesible"));
    document.head.appendChild(t);
  });
}
async function cargarMsal(){
  if(typeof msal!=="undefined") return;
  const errores=[];
  for(const url of CDNS){
    try{ await inyectar(url); return; }
    catch(e){ errores.push(`${new URL(url).hostname}: ${e.message}`); }
  }
  throw new Error("No se ha podido cargar la librería de inicio de sesión de Microsoft desde ningún origen. "
    + errores.join(" · ")
    + ". Si estás en la red corporativa, pide que se permita alcdn.msauth.net.");
}

/* ============ entorno ============ */
function entornoNoValido(){
  if(location.protocol==="file:")
    return "Estás abriendo el archivo directamente desde el disco (file://). "
         + "El inicio de sesión de Microsoft necesita una dirección web publicada.";
  if(window.self!==window.top || location.origin==="null")
    return "La página se está mostrando dentro de una vista previa aislada. "
         + "Publica el archivo en SharePoint o en un servidor web y ábrelo en su propia pestaña.";
  return null;
}

/* ============ autenticación ============ */
async function iniciarMsal(){
  await cargarMsal();
  S.msal = new msal.PublicClientApplication({
    auth:{
      clientId: CFG.clientId,
      authority: `https://login.microsoftonline.com/${CFG.tenantId}`,
      redirectUri: window.location.origin + window.location.pathname,
      postLogoutRedirectUri: window.location.origin + window.location.pathname,
      navigateToLoginRequestUrl: true
    },
    cache:{ cacheLocation:"sessionStorage", storeAuthStateInCookie:false }
  });
  if(typeof S.msal.initialize === "function") await S.msal.initialize();

  // Vuelta desde login.microsoftonline.com tras el redirect
  const res = await S.msal.handleRedirectPromise();
  if(res && res.account){
    S.msal.setActiveAccount(res.account);
    return res.account;
  }
  const cuentas = S.msal.getAllAccounts();
  if(cuentas.length){ S.msal.setActiveAccount(cuentas[0]); return cuentas[0]; }
  return null;
}
const AMBITOS = ["Sites.ReadWrite.All","User.Read"];

async function conseguirToken(){
  const cuenta = S.msal.getActiveAccount();
  try{
    const r = await S.msal.acquireTokenSilent({scopes:AMBITOS, account:cuenta});
    return r.accessToken;
  }catch(e){
    // La sesión ha caducado: se renueva en la misma pestaña
    await S.msal.acquireTokenRedirect({scopes:AMBITOS, account:cuenta});
    throw new Error("Renovando la sesión…");
  }
}

/* ============ llamadas a Graph ============ */
async function graph(ruta, opciones){
  const token = await conseguirToken();
  const url = ruta.startsWith("http") ? ruta : GRAPH + ruta;
  const r = await fetch(url, Object.assign({}, opciones, {
    headers: Object.assign({
      Authorization: "Bearer " + token,
      "Content-Type": "application/json"
    }, (opciones && opciones.headers) || {})
  }));
  if(!r.ok){
    let detalle = "";
    try{ const j = await r.json(); detalle = (j.error && j.error.message) || ""; }catch(_){}
    throw new Error(`${r.status} ${r.statusText}${detalle ? " — " + detalle : ""}`);
  }
  return r.status === 204 ? null : r.json();
}

async function resolverLista(){
  const sitio = await graph(`/sites/${CFG.hostname}:${CFG.rutaSitio}`);
  S.siteId = sitio.id;

  const listas = await graph(`/sites/${S.siteId}/lists?$select=id,name,displayName`);
  const l = listas.value.find(x =>
    x.displayName === CFG.lista || x.name === CFG.lista ||
    x.displayName.toLowerCase() === CFG.lista.toLowerCase());
  if(!l) throw new Error(`No encuentro la lista "${CFG.lista}" en el sitio.`);
  S.listId = l.id;

  const cols = await graph(`/sites/${S.siteId}/lists/${S.listId}/columns`);
  S.cols = cols.value;

  const esSistema = c =>
    c.hidden || c.readOnly || c.name.startsWith("_") ||
    CFG.excluir.includes(c.name) || CFG.excluir.includes(c.displayName) ||
    (c.columnGroup || "").indexOf("_Hidden") === 0;

  // Traduce nombre visible -> nombre interno. Acepta coincidencia exacta y,
  // si no la hay, por prefijo (los encabezados salen truncados en la vista).
  const buscar = etiqueta => {
    if(!etiqueta) return null;
    const e = String(etiqueta).trim().toLowerCase();
    const norm = x => String(x||"").trim().toLowerCase();
    return (S.cols.find(c => norm(c.displayName) === e)
         || S.cols.find(c => norm(c.name) === e)
         || S.cols.find(c => norm(c.displayName).startsWith(e))
         || S.cols.find(c => norm(c.name).startsWith(e))
         || {}).name || null;
  };

  S.col = {
    fecha  : buscar(CFG.colFecha),
    planta : buscar(CFG.colPlanta),
    sub    : buscar(CFG.colSubPlanta),
    empresa: buscar(CFG.colEmpresa),
    id     : buscar(CFG.colId)
  };

  const faltan = ["fecha","planta","empresa"].filter(k => !S.col[k]);
  if(faltan.length){
    const disp = S.cols.filter(c => !esSistema(c))
      .map(c => `${c.displayName} → ${c.name}`).join(", ");
    throw new Error(`No encuentro las columnas ${faltan.join(", ")}. Columnas de datos: ${disp}`);
  }

  const reservadas = Object.values(S.col).filter(Boolean);
  const tipoDe = n => { const c = S.cols.find(x => x.name === n); return c && !!c.number; };

  if(CFG.campos && CFG.campos.length){
    S.campos = [];
    S.camposNoHallados = [];
    for(const f of CFG.campos){
      const n = buscar(f.col);
      if(!n){ S.camposNoHallados.push(f.col); continue; }
      S.campos.push({ nombre:n, etiqueta:f.etiqueta || f.col, numerico:tipoDe(n) });
    }
  }else{
    S.campos = S.cols.filter(c => !esSistema(c) && !reservadas.includes(c.name))
      .map(c => ({ nombre:c.name, etiqueta:c.displayName||c.name, numerico:!!c.number }));
    S.camposNoHallados = [];
  }
}

async function cargarItems(){
  let url = `/sites/${S.siteId}/lists/${S.listId}/items?expand=fields&$top=999`;
  const todos = [];
  while(url){
    const p = await graph(url);
    todos.push(...p.value);
    url = p["@odata.nextLink"] || null;
  }
  S.items = todos;

  // Catálogo fijo primero; después, cualquier combinación histórica que no esté
  const vistos = new Map();
  for(const c of (CFG.lineas || [])){
    const n = { planta:txt(c.planta), sub:txt(c.sub), empresa:txt(c.empresa),
                principal: !!c.principal };
    vistos.set(clave(n), n);
  }
  for(const it of todos){
    const f = it.fields || {};
    const c = {
      planta : txt(f[S.col.planta]),
      sub    : S.col.sub ? txt(f[S.col.sub]) : "",
      empresa: txt(f[S.col.empresa])
    };
    if(c.planta === "" ) continue;
    if(!vistos.has(clave(c))) vistos.set(clave(c), c);
  }
  S.combos = [...vistos.values()].sort((a,b) =>
    String(a.empresa).localeCompare(String(b.empresa)) ||
    (Number(a.planta) - Number(b.planta)) ||
    String(a.sub).localeCompare(String(b.sub)));
}

function siguienteId(){
  let max = 0;
  for(const it of S.items){
    const v = Number((it.fields||{})[S.col.id]);
    if(!isNaN(v) && v > max) max = v;
  }
  return max + 1;
}

/* ============ pintado ============ */
function lineasVisibles(){
  return [...S.combos, ...S.extra].filter(c => txt(c.empresa) === txt(S.empresa));
}
function itemDe(combo){
  return S.items.find(it => {
    const f = it.fields || {};
    return mesDeFecha(f[S.col.fecha]) === S.mes
      && txt(f[S.col.planta]) === txt(combo.planta)
      && (!S.col.sub || txt(f[S.col.sub]) === txt(combo.sub))
      && txt(f[S.col.empresa]) === txt(combo.empresa);
  });
}

function principalDe(c){
  const p = S.combos.find(x => x.principal && txt(x.planta)===txt(c.planta)
                            && txt(x.empresa)===txt(c.empresa));
  return p ? (p.sub || `planta ${p.planta}`) : null;
}

function celdasDe(combo, campos){
  const k = clave(combo);
  const it = itemDe(combo);
  const f = it ? it.fields : {};
  return campos.map(campo => {
    const pend = S.tocado[k] && Object.prototype.hasOwnProperty.call(S.tocado[k], campo.nombre);
    const valor = pend ? S.tocado[k][campo.nombre] : mostrar(f[campo.nombre]);
    return `<div class="celda">
      <label for="c_${escapar(k)}_${campo.nombre}">${escapar(campo.etiqueta)}</label>
      <input id="c_${escapar(k)}_${campo.nombre}" type="text" inputmode="decimal"
             class="${pend ? "tocado" : ""}"
             data-linea="${escapar(k)}" data-campo="${campo.nombre}"
             value="${escapar(valor)}" autocomplete="off">
    </div>`;
  }).join("");
}

function marcaEstado(combo){
  const k = clave(combo);
  const hayCambios = S.tocado[k] && Object.keys(S.tocado[k]).length;
  const e = hayCambios ? ["pendiente","Sin guardar"]
          : itemDe(combo) ? ["guardado","Guardado"] : ["pendiente","Sin datos"];
  return `<span class="estado ${e[0]}" data-estado="${escapar(k)}"><i class="punto"></i>${e[1]}</span>`;
}

function pintar(){
  $("mesNombre").textContent = nombreMes(S.mes);

  const dePlanta = S.campos.filter(f =>  f.porPlanta);
  const deLinea  = S.campos.filter(f => !f.porPlanta);
  const lineas   = lineasVisibles();

  if(!lineas.length){
    $("contenido").innerHTML = `<div class="vacio">
      <p>No hay ninguna línea configurada para ${escapar(S.empresa)}.</p>
      <p>Revisa el catálogo de líneas en la configuración.</p></div>`;
    $("avanceTexto").textContent = "Sin líneas";
    $("avanceSegmentos").innerHTML = "";
    actualizarPie();
    return;
  }

  // agrupar por almacén
  const grupos = new Map();
  for(const c of lineas){
    const g = txt(c.planta);
    if(!grupos.has(g)) grupos.set(g, []);
    grupos.get(g).push(c);
  }
  const peso = sub => {
    const i = (CFG.ordenLineas || []).indexOf(txt(sub).toUpperCase());
    return i === -1 ? 99 : i;
  };
  for(const cs of grupos.values())
    cs.sort((a,b) => peso(a.sub) - peso(b.sub) || txt(a.sub).localeCompare(txt(b.sub)));
  const ordenadas = [...grupos.entries()].sort((a,b) =>
    (Number(a[0]) - Number(b[0])) || String(a[0]).localeCompare(String(b[0])));

  let html = "", guardadas = 0;
  const etqEmp = S.empresa === "FCAP" ? "fcap" : "torr";

  for(const [planta, cs] of ordenadas){
    const jefe = cs.find(x => x.principal) || cs[0];

    html += `<section class="planta" data-empresa="${escapar(S.empresa)}">
      <div class="planta-cab">
        <div class="planta-ident">
          <h2>Planta ${escapar(planta)}</h2>
          <span class="etq ${etqEmp}">${escapar(S.empresa)}</span>
        </div>
        ${dePlanta.length ? `<div class="rejilla rejilla-planta">${celdasDe(jefe, dePlanta)}</div>` : ""}
      </div>`;

    for(const c of cs){
      if(itemDe(c)) guardadas++;
      html += `<div class="linea-cab">
          <h3>${c.sub ? escapar(c.sub) : "Producción"}</h3>
          ${marcaEstado(c)}
        </div>
        <div class="rejilla">${celdasDe(c, deLinea)}</div>`;
    }
    html += `</section>`;
  }
  $("contenido").innerHTML = html;

  $("avanceTexto").innerHTML = `${guardadas} de ${lineas.length} <em>líneas con datos</em>`;
  $("avanceSegmentos").innerHTML = lineas
    .map(c => `<i class="${itemDe(c) ? "lleno" : ""}"></i>`).join("");

  $("contenido").querySelectorAll("input[data-linea]").forEach(inp => {
    inp.addEventListener("input", () => {
      const k = inp.dataset.linea, campo = inp.dataset.campo;
      S.tocado[k] = S.tocado[k] || {};
      S.tocado[k][campo] = inp.value;
      inp.classList.add("tocado");
      const badge = document.querySelector(`[data-estado="${CSS.escape(k)}"]`);
      if(badge){ badge.className = "estado pendiente"; badge.innerHTML = '<i class="punto"></i>Sin guardar'; }
      actualizarPie();
    });
  });
  actualizarPie();
}

function actualizarPie(){
  const n = Object.keys(S.tocado).filter(k => Object.keys(S.tocado[k]).length).length;
  $("pie").classList.remove("oculto");
  $("pieNota").textContent = n
    ? `${n} línea${n>1?"s":""} con cambios sin guardar`
    : "No hay cambios pendientes";
  $("btnGuardar").disabled = (n === 0) || S.guardando;
}

/* ============ guardado ============ */
async function guardar(){
  if(S.guardando) return;
  S.guardando = true;
  $("btnGuardar").disabled = true;
  $("btnGuardar").textContent = "Guardando…";
  limpiarAvisos();

  const fechaIso = fechaDeMes(S.mes);
  let nuevoId = siguienteId();
  const fallos = [];
  let hechas = 0;

  for(const k of Object.keys(S.tocado)){
    const cambios = S.tocado[k];
    if(!Object.keys(cambios).length) continue;

    const [planta, sub, empresa] = k.split("||");
    const combo = {planta, sub, empresa};
    const existente = itemDe(combo);

    // construir el payload respetando el tipo de cada columna
    const fields = {};
    for(const campo of S.campos){
      if(!Object.prototype.hasOwnProperty.call(cambios, campo.nombre)) continue;
      const bruto = cambios[campo.nombre];
      fields[campo.nombre] = campo.numerico ? aNumero(bruto) : (bruto === "" ? null : bruto);
    }
    if(!Object.keys(fields).length) continue;

    try{
      if(existente){
        const r = await graph(`/sites/${S.siteId}/lists/${S.listId}/items/${existente.id}/fields`,
          {method:"PATCH", body: JSON.stringify(fields)});
        existente.fields = Object.assign({}, existente.fields, r || fields);
      }else{
        fields[S.col.fecha]     = fechaIso;
        fields[S.col.planta]    = isNaN(Number(planta)) ? planta : Number(planta);
        fields[S.col.sub] = sub;
        fields[S.col.empresa]   = empresa;
        if(S.col.id) fields[S.col.id] = nuevoId++;
        const creado = await graph(`/sites/${S.siteId}/lists/${S.listId}/items`,
          {method:"POST", body: JSON.stringify({fields})});
        S.items.push(creado);
      }
      delete S.tocado[k];
      hechas++;
    }catch(e){
      fallos.push(`Planta ${planta}${sub ? " · " + sub : ""}: ${e.message}`);
    }
  }

  S.guardando = false;
  $("btnGuardar").textContent = "Guardar cambios";
  pintar();

  if(fallos.length) aviso("No se han podido guardar algunas líneas. " + fallos.join(" | "), "mal");
  else if(hechas)   aviso(`${hechas} línea${hechas>1?"s":""} guardada${hechas>1?"s":""} en ${nombreMes(S.mes)}.`, "bien");
}

/* ============ cambios de mes / empresa ============ */
function cambiarMes(){
  const v = $("selMes").value;
  if(!v) return;
  if(v > mesActual()){
    $("selMes").value = S.mes;
    aviso("No se pueden registrar meses futuros. Selecciona el mes en curso o uno anterior.", "mal");
    return;
  }
  if(Object.keys(S.tocado).some(k => Object.keys(S.tocado[k]).length)){
    if(!confirm("Hay cambios sin guardar que se perderán. ¿Continuar?")){
      $("selMes").value = S.mes; return;
    }
  }
  S.tocado = {}; S.mes = v; limpiarAvisos(); pintar();
}

/* ============ arranque ============ */
async function arrancar(){
  $("portada").classList.add("oculto");
  $("barra").classList.remove("oculto");
  $("app").classList.remove("oculto");
  $("usuario").textContent = S.cuenta.name || S.cuenta.username;

  S.mes = mesAnterior();
  S.empresa = CFG.empresas[0];
  $("selMes").value = S.mes;
  $("selMes").max = mesActual();
  $("selEmpresa").innerHTML = CFG.empresas.map(e => `<option>${escapar(e)}</option>`).join("");

  try{
    await resolverLista();
    try{
      await cargarItems();
    }catch(e){
      S.combos = (CFG.lineas || []).map(c => ({planta:txt(c.planta), sub:txt(c.sub),
                                               empresa:txt(c.empresa), principal:!!c.principal}));
      aviso("No se han podido leer los datos existentes, pero puedes registrar el mes. " + e.message, "mal");
    }
    if(!S.campos.length){
      aviso("La lista no tiene columnas editables que mostrar. Revisa el bloque CFG.excluir.", "mal");
    }
    pintar();
  }catch(e){
    $("contenido").innerHTML = "";
    aviso("No se ha podido cargar la lista. " + e.message, "mal");
  }
}

$("btnEntrar").addEventListener("click", async () => {
  const err = $("errorLogin");
  err.classList.add("oculto");
  $("btnEntrar").disabled = true;
  $("btnEntrar").textContent = "Redirigiendo…";
  try{
    if(!S.msal) await iniciarMsal();
    await S.msal.loginRedirect({scopes:AMBITOS});   // no vuelve: navega fuera
  }catch(e){
    let m = e.message || String(e);
    if(/redirect_uri|AADSTS50011/i.test(m))
      m = "La dirección de esta página no está dada de alta como Redirect URI de tipo SPA en el registro de Azure AD. "
        + "Añade exactamente: " + location.origin + location.pathname;
    err.textContent = m;
    err.classList.remove("oculto");
    $("btnEntrar").disabled = false;
    $("btnEntrar").textContent = "Entrar con Microsoft";
  }
});
$("btnSalir").addEventListener("click", () => S.msal.logoutRedirect({
  postLogoutRedirectUri: location.origin + location.pathname
}));
$("selMes").addEventListener("change", cambiarMes);
$("selEmpresa").addEventListener("change", () => {
  S.empresa = $("selEmpresa").value; limpiarAvisos(); pintar();
});
$("btnGuardar").addEventListener("click", guardar);
$("btnCols").addEventListener("click", verColumnas);
window.addEventListener("beforeunload", e => {
  if(Object.keys(S.tocado).some(k => Object.keys(S.tocado[k]).length)){
    e.preventDefault(); e.returnValue = "";
  }
});

(async function(){
  const problema = entornoNoValido();
  if(problema){
    $("errorLogin").textContent = problema;
    $("errorLogin").classList.remove("oculto");
    return;
  }
  $("btnEntrar").classList.add("oculto");
  $("esperando").classList.remove("oculto");
  try{
    const cuenta = await iniciarMsal();
    $("esperando").classList.add("oculto");
    $("btnEntrar").classList.remove("oculto");
    if(cuenta){ S.cuenta = cuenta; arrancar(); }
  }catch(e){
    $("esperando").classList.add("oculto");
    $("btnEntrar").classList.remove("oculto");
    $("errorLogin").textContent = e.message || String(e);
    $("errorLogin").classList.remove("oculto");
  }
})();
</script>
</body>
</html>
